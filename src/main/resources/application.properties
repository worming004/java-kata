# SQL Server (local dev)
# Start a local SQL Server container:
#   docker run -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Dev!Passw0rd \
#              -p 1433:1433 --name sqlserver-dev -d mcr.microsoft.com/mssql/server:2022-latest
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=library;encrypt=false
spring.datasource.username=sa
spring.datasource.password=Dev!Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
